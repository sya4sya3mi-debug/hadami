<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- cream background -->
  <rect width="32" height="32" fill="#f5f1eb"/>
  <!-- 3px top rule (brand accent) -->
  <rect y="0" width="32" height="3" fill="#2c2418"/>
  <!-- "H" lettermark in editorial serif style -->
  <text
    x="16"
    y="24"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-style="italic"
    fill="#2c2418"
    letter-spacing="-0.5"
  >H</text>
</svg>
